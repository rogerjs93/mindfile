[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindfile"
version = "1.1.0"
description = "An AI-native, self-clustering, content-verifiable multimodal file format (.gnos), inspired by Turso/libSQL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Roger", email = "rogerjs93@gmail.com" }]
keywords = ["vector-database", "embeddings", "clustering", "integrity", "eeg", "medical", "sqlite", "libsql", "ai-native"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Database",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "scipy>=1.10",          # imported directly (EEG welch, ECG find_peaks); also a scikit-learn dep
]

[project.optional-dependencies]
eeg = ["mne>=1.5"]                      # EDF/BDF/FIF reading (non-EDF paths)
imaging = ["nibabel>=5", "pydicom>=2.3"]  # NIfTI volumes + DICOM files/pixels
waveforms = ["wfdb>=4"]                 # PhysioNet WFDB record paths
text = ["sentence-transformers>=2.2"]   # production text embeddings (baseline is dependency-free)
auth = ["cryptography>=41"]             # Ed25519 signatures (HMAC fallback needs nothing)
dev = ["pytest>=7.0"]
all = ["mne>=1.5", "nibabel>=5", "pydicom>=2.3", "wfdb>=4",
       "sentence-transformers>=2.2", "cryptography>=41"]

[project.urls]
Documentation = "https://github.com/rogerjs93/mindfile#readme"
Source = "https://github.com/rogerjs93/mindfile"

[project.scripts]
mind = "mindfile.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mindfile = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
